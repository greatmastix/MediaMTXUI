# Runs the same commands as a local checkout: everything happens in the containers pinned in deploy/tools.env.
# The audit also runs every week, since new advisories appear without a change here.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 5 * * 1"

permissions:
  contents: read

jobs:
  ci:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: scripts/ci-run.sh ./dev ci

  e2e:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: scripts/ci-run.sh ./dev e2e

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # gitleaks reads every commit
      - run: scripts/ci-run.sh ./dev audit

  # The install script on a fresh runner, in local mode, with the files of this checkout (and main's edge image):
  # a first install, then a second run, which upgrades.
  install:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install with scripts/install.sh
        run: |
          mkdir dist && cp compose.yaml deploy/compose.lan.yaml dist/ && cp .env.example dist/env.example
          # Piped into bash, as the README runs it (curl ... | sudo bash), answering its questions on a terminal (script):
          # 2 (local network), then the address. (--skip-checks: a runner has too little free disk for the recordings floors.)
          printf '2\n127.0.0.1\n' | script -qec "cat scripts/install.sh | sudo MTXUI_INSTALL_BASE=file://$PWD/dist bash -s -- --skip-checks --dir /tmp/mtxui" /dev/null | tee install.log
          grep -q "Setup token: " install.log
          curl -fsS http://127.0.0.1:8080/api/v1/health
      - name: Run it again (the upgrade path)
        run: |
          cat scripts/install.sh | sudo MTXUI_INSTALL_BASE="file://$PWD/dist" bash -s -- --yes --dir /tmp/mtxui | tee upgrade.log
          grep -q "Upgraded and running" upgrade.log
          curl -fsS http://127.0.0.1:8080/api/v1/health
      - name: Logs
        if: failure()
        run: sudo docker compose --project-directory /tmp/mtxui logs --tail 50
