# Publishes the sidecar image to ghcr.io for linux/amd64, arm64 and arm/v7: on a version tag (v1.2.3) as 1.2.3, 1.2,
# 1 and latest, and on every push to main as edge. The same checks as ci.yml run first. The Go and web stages
# cross-compile on the runner (Dockerfile), so no emulation is needed. Provenance and the SBOM are buildx's, attached
# to the image; there is no GitHub attestation, so no job needs an OIDC token.
#
# On a tag, the install files then go to the GitHub release (created with generated notes if it does not exist yet):
# compose.yaml with the sidecar image pinned to that version, next to the MediaMTX image it pins already, so that the
# README's install and upgrade always fetch a pair that was tested together; .env.example as env.example (GitHub
# renames assets with a leading dot); the optional overrides (behind a proxy, local network, exposure control); and
# install.sh, which installs or upgrades to the newest release (or the one given with --version).
name: release

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: scripts/ci-run.sh ./dev ci
      - run: scripts/ci-run.sh ./dev e2e

  image:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/mediamtxui
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=edge,branch=main
          flavor: |
            latest=auto
          labels: |
            org.opencontainers.image.title=MediaMTX UI
            org.opencontainers.image.description=A web UI for MediaMTX: streams, live view, recordings, users, backups
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_type == 'tag' && github.ref_name || format('edge-{0}', github.sha) }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

  install-files:
    if: github.ref_type == 'tag'
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Pin the sidecar image in compose.yaml to this version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          v=${TAG#v}
          [[ $v =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo "::error::not a version tag: $TAG"; exit 1; }
          mkdir dist
          sed "s|mediamtxui:\${MTXUI_VERSION:-edge}|mediamtxui:\${MTXUI_VERSION:-$v}|" compose.yaml >dist/compose.yaml
          grep -qF "mediamtxui:\${MTXUI_VERSION:-$v}" dist/compose.yaml ||
            { echo "::error::compose.yaml names no sidecar image to pin"; exit 1; }
          cp .env.example dist/env.example
          cp deploy/compose.behind-proxy.yaml deploy/compose.exposure.yaml deploy/compose.lan.yaml dist/
          cp scripts/install.sh dist/install.sh
      - name: Attach them to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            pre=()
            [[ $TAG == *-* ]] && pre=(--prerelease) # a pre-release is never releases/latest
            gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes "${pre[@]}"
          fi
