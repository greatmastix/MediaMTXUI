# Exposure control (docs/exposure-control.md): the stream ports stay closed to the internet except when an admin
# opens them on the Exposure page, or an automatic rule does (all on by default): an encoder's address while its
# stream page is open, and anyone while a stream is live or has a holding screen, or a guest publish key is valid.
# It needs the host helper mtx-portgate and a firewall in front of Docker's published ports (a cloud firewall, for
# one). Use it on top of compose.yaml: put it next to it, and add this line to .env (with compose.behind-proxy.yaml
# in the list too, if you use that), so that every docker compose command uses both files:
#
#   COMPOSE_FILE=compose.yaml:compose.exposure.yaml
#
# (In a checkout of the repository: docker compose -f compose.yaml -f deploy/compose.exposure.yaml up -d.)
services:
  sidecar:
    environment:
      MTXUI_EXPOSURE_CONTROL: "on"
    volumes:
      # The sidecar writes the wanted rules here; the helper reads them and writes its status back (read-only here).
      - ${PORTGATE_DIR:-/var/lib/mtx-portgate-requests}:/data/portgate
      - ${PORTGATE_STATUS_DIR:-/var/lib/mtx-portgate}:/data/portgate-status:ro
